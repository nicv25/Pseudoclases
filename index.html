<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuadrícula con Bootstrap</title>

    <!-- Bootstrap: el CSS se carga desde internet (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Nuestro CSS va DESPUÉS de Bootstrap para poder ajustar cosas -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- .container: centra todo y le da un ancho máximo -->
    <div class="container-fluid">

        <!-- 1. MENÚ: 4 casillas en fila -->
        <nav class="nav nav-fill bg-dark">
            <a class="nav-link text-white" href="#"> Nombre 1 </a>
            <a class="nav-link text-white" href="#"> Nombre 2 </a>
            <a class="nav-link text-white" href="#"> Nombre 3 </a>
            <a class="nav-link text-white" href="#"> Nombre 4 </a>
        </nav>

        <!-- 2. BANNER: cuadro grande con la X -->
        <header class="banner bg-secondary-subtle d-flex justify-content-center align-items-center">
            Hero
        </header>

        <!-- 3. PRESENTACIÓN: texto | imagen -->
        <section class="row row-cols-1 row-cols-xl-2 p-5">
            <div class="col d-flex flex-column text-center align-items-start">
                <h1>Título principal</h1>
                <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore
                    et dolore magna aliqua.</p>
            </div>
            <div class="col d-none d-md-block d-xl-block">
                <div class="imagen bg-secondary-subtle d-flex justify-content-center align-items-center">
                    Imagen
                </div>
            </div>
        </section>

        <!-- 4. CUADRÍCULA: 6 columnas x 3 filas = 18 celdas -->
        <section class="row g-0 ">
            <div class="celda col-6 col-md-4 col-xl-2">
                1
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                2
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                3
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                4
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                5
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                6
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                7
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                8
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                9
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                10
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                11
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                12
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                13
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                14
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                15
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                16
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                17
            </div>
            <div class="celda col-6 col-md-4 col-xl-2">
                18
            </div>
        </section>

    </div>

</body>
