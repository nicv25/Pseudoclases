<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8A7F70" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- tarjeta de código -->
  <g filter="url(#sombra)">
    <rect x="20" y="20" width="600" height="170" rx="28" fill="#FBF8F3"/>
  </g>
  <text x="48" y="58" font-size="15" letter-spacing="3" fill="#8C9A8E" font-weight="700">ANATOMÍA</text>

  <g font-family="'Courier New', monospace" font-size="28" font-weight="700">
    <rect x="44" y="84" width="104" height="48" rx="14" fill="#DCE6DA"/>
    <text x="54" y="117" fill="#4A5A4D" textLength="84" lengthAdjust="spacingAndGlyphs">boton</text>
    <rect x="154" y="84" width="118" height="48" rx="14" fill="#F3C9CF"/>
    <text x="163" y="117" fill="#8E4A55" textLength="100" lengthAdjust="spacingAndGlyphs">:hover</text>
    <text x="286" y="117" fill="#6B7F6E" textLength="290" lengthAdjust="spacingAndGlyphs">{ color: lila; }</text>
  </g>
  <g font-size="15" font-weight="700">
    <path d="M96 140 v14" stroke="#A7B8A7" stroke-width="3" stroke-linecap="round"/>
    <text x="96" y="174" text-anchor="middle" fill="#6B7F6E">selector</text>
    <path d="M213 140 v14" stroke="#E8A9B1" stroke-width="3" stroke-linecap="round"/>
    <text x="213" y="174" text-anchor="middle" fill="#B5626E">pseudoclase</text>
    <path d="M431 140 v14" stroke="#C9BDAF" stroke-width="3" stroke-linecap="round"/>
    <text x="431" y="174" text-anchor="middle" fill="#8A7F70">estilo del estado</text>
  </g>

  <!-- estados: normal -> hover -->
  <g filter="url(#sombra)">
    <rect x="20" y="214" width="600" height="186" rx="28" fill="#FBF8F3"/>
  </g>
  <text x="48" y="252" font-size="15" letter-spacing="3" fill="#8C9A8E" font-weight="700">ESTADOS</text>

  <!-- normal -->
  <rect x="60" y="284" width="180" height="62" rx="31" fill="none" stroke="#A7B8A7" stroke-width="3"/>
  <text x="150" y="323" text-anchor="middle" font-size="22" font-weight="700" fill="#6B7F6E">Botón</text>
  <text x="150" y="388" text-anchor="middle" font-size="15" fill="#8A7F70">normal</text>

  <!-- flecha -->
  <path d="M276 315 h80" stroke="#C9BDAF" stroke-width="5" stroke-linecap="round"/>
  <path d="M344 302 l14 13 -14 13" fill="none" stroke="#C9BDAF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- hover -->
  <rect x="396" y="278" width="180" height="62" rx="31" fill="#B9A6E0"/>
  <text x="486" y="317" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Botón</text>
  <path d="M548 314 L548 352 L558 343 L565 360 L573 356 L566 340 L580 340 Z" fill="#FFFFFF" stroke="#4A5A4D" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="486" y="388" text-anchor="middle" font-size="15" fill="#8A7F70">con el mouse encima</text>
</svg>
