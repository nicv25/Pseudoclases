<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8A7F70" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- tarjeta de código -->
  <g filter="url(#sombra)">
    <rect x="20" y="20" width="600" height="170" rx="28" fill="#FBF8F3"/>
  </g>
  <text x="48" y="58" font-size="15" letter-spacing="3" fill="#8C9A8E" font-weight="700">ANATOMÍA</text>

  <g font-family="'Courier New', monospace" font-size="34" font-weight="700">
    <rect x="44" y="82" width="98" height="52" rx="14" fill="#DCE6DA"/>
    <text x="58" y="120" fill="#4A5A4D">boton</text>
    <rect x="148" y="82" width="140" height="52" rx="14" fill="#F3C9CF"/>
    <text x="160" y="120" fill="#8E4A55">:hover</text>
    <text x="300" y="120" fill="#6B7F6E">{ color: lila; }</text>
  </g>
  <g font-size="15" font-weight="700">
    <path d="M93 140 v14" stroke="#A7B8A7" stroke-width="3" stroke-linecap="round"/>
    <text x="93" y="174" text-anchor="middle" fill="#6B7F6E">selector</text>
    <path d="M218 140 v14" stroke="#E8A9B1" stroke-width="3" stroke-linecap="round"/>
    <text x="218" y="174" text-anchor="middle" fill="#B5626E">pseudoclase</text>
    <path d="M440 140 v14" stroke="#C9BDAF" stroke-width="3" stroke-linecap="round"/>
    <text x="440" y="174" text-anchor="middle" fill="#8A7F70">estilo del estado</text>
  </g>

  <!-- estados: normal -> hover -->
  <g filter="url(#sombra)">
    <rect x="20" y="214" width="600" height="186" rx="28" fill="#FBF8F3"/>
  </g>
  <text x="48" y="252" font-size="15" letter-spacing="3" fill="#8C9A8E" font-weight="700">ESTADOS</text>

  <!-- normal -->
  <rect x="60" y="284" width="180" height="62" rx="31" fill="none" stroke="#A7B8A7" stroke-width="3"/>
  <text x="150" y="323" text-anchor="middle" font-size="22" font-weight="700" fill="#6B7F6E">Botón</text>
  <text x="150" y="376" text-anchor="middle" font-size="15" fill="#8A7F70">normal</text>

  <!-- flecha -->
  <path d="M276 315 h80" stroke="#C9BDAF" stroke-width="5" stroke-linecap="round"/>
  <path d="M344 302 l14 13 -14 13" fill="none" stroke="#C9BDAF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- hover -->
  <rect x="396" y="278" width="180" height="62" rx="31" fill="#B9A6E0"/>
  <text x="486" y="317" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Botón</text>
  <path d="M540 322 L540 364 L551 354 L559 372 L568 368 L560 350 L575 350 Z" fill="#FFFFFF" stroke="#4A5A4D" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="486" y="382" text-anchor="middle" font-size="15" fill="#8A7F70">con el mouse encima</text>
</svg>
