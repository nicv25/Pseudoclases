<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F2EA"/>
      <stop offset="1" stop-color="#EDE6DA"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8A7F70" flood-opacity=".18"/>
    </filter>
    <filter id="suave" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1600" height="520" fill="url(#fondo)"/>

  <!-- manchas de color difuminadas -->
  <g filter="url(#suave)" opacity=".55">
    <circle cx="160" cy="120" r="140" fill="#F3C9CF"/>
    <circle cx="1450" cy="90" r="150" fill="#CFE0CF"/>
    <circle cx="1380" cy="460" r="130" fill="#D8CDEE"/>
    <circle cx="260" cy="470" r="120" fill="#F7DDB0"/>
    <circle cx="800" cy="520" r="160" fill="#C9D8EE"/>
  </g>

  <!-- puntos decorativos -->
  <g fill="#C9BDAF" opacity=".55">
    <circle cx="560" cy="70" r="5"/><circle cx="590" cy="70" r="5"/><circle cx="620" cy="70" r="5"/>
    <circle cx="560" cy="100" r="5"/><circle cx="590" cy="100" r="5"/><circle cx="620" cy="100" r="5"/>
    <circle cx="990" cy="440" r="5"/><circle cx="1020" cy="440" r="5"/><circle cx="1050" cy="440" r="5"/>
    <circle cx="990" cy="470" r="5"/><circle cx="1020" cy="470" r="5"/><circle cx="1050" cy="470" r="5"/>
  </g>

  <!-- IZQUIERDA: botón con cursor encima (hover) -->
  <g transform="translate(60 60) rotate(-6)" filter="url(#sombra)">
    <rect width="250" height="84" rx="42" fill="#6B7F6E"/>
    <rect x="34" y="34" width="120" height="16" rx="8" fill="#F4EFE8" opacity=".9"/>
    <path d="M190 30 l22 12 -22 12" fill="none" stroke="#F4EFE8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(250 125)">
    <circle r="34" fill="#F3C9CF" opacity=".55"/>
    <circle r="54" fill="none" stroke="#F3C9CF" stroke-width="4" opacity=".6"/>
    <path d="M0 0 L0 58 L15 44 L26 68 L38 62 L27 39 L47 39 Z" fill="#FFFFFF" stroke="#4A5A4D" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- IZQUIERDA ABAJO: interruptor encendido (checked) -->
  <g transform="translate(60 385)" filter="url(#sombra)">
    <rect width="260" height="110" rx="28" fill="#FBF8F3"/>
    <rect x="28" y="33" width="88" height="44" rx="22" fill="#6B7F6E"/>
    <circle cx="94" cy="55" r="17" fill="#FFFFFF"/>
    <rect x="140" y="33" width="44" height="44" rx="12" fill="#A7B8A7"/>
    <path d="M150 55 l9 9 16 -18" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="198" y="33" width="44" height="44" rx="12" fill="none" stroke="#C9BDAF" stroke-width="4"/>
  </g>

  <!-- ARRIBA CENTRO-IZQ: paleta de colores -->
  <g transform="translate(430 405) rotate(6)" filter="url(#sombra)">
    <rect width="230" height="76" rx="38" fill="#FBF8F3"/>
    <circle cx="44" cy="38" r="20" fill="#E8A9B1"/>
    <circle cx="92" cy="38" r="20" fill="#F2BFA0"/>
    <circle cx="140" cy="38" r="20" fill="#9DB4D8"/>
    <circle cx="188" cy="38" r="20" fill="#9FC1A2"/>
  </g>

  <!-- DERECHA: campo de texto con anillo de enfoque (focus) -->
  <g transform="translate(1170 50) rotate(4)">
    <rect x="-12" y="-12" width="374" height="100" rx="40" fill="none" stroke="#B9A6E0" stroke-width="6" opacity=".7"/>
    <g filter="url(#sombra)">
      <rect width="350" height="76" rx="30" fill="#FBF8F3"/>
    </g>
    <circle cx="44" cy="38" r="13" fill="none" stroke="#6B7F6E" stroke-width="5"/>
    <path d="M54 48 l10 10" stroke="#6B7F6E" stroke-width="5" stroke-linecap="round"/>
    <rect x="84" y="30" width="140" height="16" rx="8" fill="#D9E1D9"/>
    <rect x="232" y="22" width="4" height="32" rx="2" fill="#6B7F6E"/>
  </g>

  <!-- DERECHA ABAJO: tarjeta con lista donde resalta el primero y uno par (nth-child) -->
  <g transform="translate(1250 335) rotate(-5) scale(.8)" filter="url(#sombra)">
    <rect width="300" height="190" rx="30" fill="#FBF8F3"/>
    <rect x="28" y="30" width="244" height="30" rx="15" fill="#F3C9CF"/>
    <rect x="28" y="72" width="244" height="30" rx="15" fill="#EDE6DA"/>
    <rect x="28" y="114" width="244" height="30" rx="15" fill="#CFE0CF"/>
    <rect x="28" y="156" width="170" height="14" rx="7" fill="#EDE6DA"/>
  </g>

  <!-- DERECHA: notificación con check (valid) -->
  <g transform="translate(860 40) rotate(-3)" filter="url(#sombra)">
    <rect width="190" height="66" rx="33" fill="#DCE6DA"/>
    <circle cx="34" cy="33" r="18" fill="#6B7F6E"/>
    <path d="M25 33 l6 6 12 -13" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="25" width="96" height="16" rx="8" fill="#FBF8F3"/>
  </g>

  <!-- formas flotantes -->
  <circle cx="420" cy="80" r="16" fill="#F7DDB0"/>
  <circle cx="1150" cy="440" r="12" fill="#E8A9B1"/>
  <rect x="1500" y="250" width="34" height="34" rx="10" fill="#B9A6E0" transform="rotate(18 1517 267)"/>
  <rect x="40" y="250" width="26" height="26" rx="8" fill="#9DB4D8" transform="rotate(-14 53 263)"/>
  <path d="M760 480 q20 -30 40 0 t40 0" fill="none" stroke="#A7B8A7" stroke-width="6" stroke-linecap="round"/>
  <path d="M680 50 q20 -26 40 0 t40 0" fill="none" stroke="#E8A9B1" stroke-width="6" stroke-linecap="round"/>
</svg>
